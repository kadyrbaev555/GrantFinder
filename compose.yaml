x-backend: &backend
  image: grantfinder-backend:local
  env_file: .env
  environment:
    PGHOST: db
    PGPORT: "5432"
    GIN_MODE: release

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    build: ./backend
    command: ["/app/migrate", "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    pull_policy: never
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
