# Dependabot раз в неделю проверяет зависимости и открывает PR с обновлениями.
# Документация: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # React, Vite и остальные npm-пакеты фронтенда
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  # Go-модули бэкенда (Gin, sqlx, Goose, pq)
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  # Базовый образ golang в backend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Actions в .github/workflows (checkout, gitleaks)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
